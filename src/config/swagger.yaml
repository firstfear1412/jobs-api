openapi: 3.0.0
info:
  title: ๋Jobs API
  description: Finds Jobs Project from Kasetsart University Sriracha Campus.
  version: 0.1
servers:
  - url: http://localhost:3000/
    # description: My Localhost
paths:
  /dashboard/topSkillByPost/{type}:
    get:
      summary: "Get top 5 skills by post type"
      tags:
        - "dashboard"
      parameters:
        - name: "type"
          in: "path"
          description: "The type of skill to fetch (e.g., 'hard_skill', 'soft_skill')"
          required: true
          type: "string"
      responses:
        200:
          description: "A list of skills with job count"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/avgSalary:
    get:
      summary: "Get min, max, average salary of all jobs by city"
      tags:
        - "dashboard"
      parameters:
        - name: "city"
          in: "query"
          description: "city to filter job salary"
          schema:
            type: "string"
            format: "string"
            nullable: true
      responses:
        200:
          description: "A result min, max, and average salary of max salary"
        404:
          description: "Data not found"
  /dashboard/jobByStatus:
    post:
      summary: Get job information by status or count jobs if no status provided.
      description: |
        - If status is provided, returns detailed job information.
        - If no status is provided (or status is null), returns the count of jobs by status.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/status"
      responses:
        200:
          description: "A list of Status with job count"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"

  /dashboard/jobByMaxSalary:
    post:
      summary: Get job information with the highest salary by subcategory.
      description: |
        - If no subcategory name is provided, this API returns the jobs with the highest salary by subcategory.
        - If a subcategory name is provided, it returns jobs in that subcategory with the highest salary.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/topSelectSalary"
      responses:
        200:
          description: "Successful response with job data based on the maximum salary."
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByMinSalary:
    post:
      summary: "Get job information with the lowest salary by subcategory."
      description: |
        - If no subcategory name is provided, this API returns the jobs with the lowest salary by subcategory.
        - If a subcategory name is provided, it returns jobs in that subcategory with the lowest salary.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/topSelectSalary"
      responses:
        200:
          description: "Successful response with job data based on the minimum salary."
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByIndustry:
    get:
      summary: "Get job count by industry"
      tags:
        - "dashboard"
      responses:
        200:
          description: "A list of Status with job count"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByIndustry/{industry}:
    get:
      summary: "Get job list by Industry"
      tags:
        - "dashboard"
      parameters:
        - name: industry
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Industry"
      responses:
        200:
          description: "A list of jobs filtered by the industry or jobs with no specified industry"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByComponySize:
    get:
      summary: "Get job count by Compony Size"
      tags:
        - "dashboard"
      responses:
        200:
          description: "A list of Compony Size with job count"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByComponySize/{componySize}:
    get:
      summary: "Get list job by compony size"
      tags:
        - "dashboard"
      parameters:
        - name: componySize
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CompanySize"
      responses:
        200:
          description: "A list of jobs filtered by the compony size or jobs with no specified compony size"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /job/search:
    post:
      summary: "Search for jobs based on filters"
      tags:
        - "job"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: "Keyword to search in company name, short name, or job title"
                  example: ".NET"
                location:
                  type: string
                  description: "Search location (city or area)"
                  example: "Bangkok"
                main_category:
                  type: string
                  nullable: true
                  description: "Main category of the job"
                  example: "Information & Communication Technology"
                sub_category:
                  type: string
                  nullable: true
                  description: "Sub-category of the job"
                  example: "Developers/Programmers"
                type:
                  type: string
                  nullable: true
                  description: "Job type (e.g., Part time, Full time, Contract/Temp, Casual/Vacation)"
                  example: null
                min_salary:
                  type: number
                  format: float
                  nullable: true
                  description: "Minimum salary filter"
                  example: 100000
                max_salary:
                  type: number
                  format: float
                  nullable: true
                  description: "Maximum salary filter"
                  example: 200000
      responses:
        200:
          description: "A list of jobs"
        400:
          description: "Invalid request"
        404:
          description: "Data not found"

  /job/search/subcatagory/{sub_category_id}:
    get:
      summary: "Get jobs by subcatagory id"
      tags:
        - "job"
      parameters:
        - name: "sub_category_id"
          in: "path"
          description: "The sub_category_id of the job"
          required: true
          type: "integer"
      responses:
        200:
          description: "A list of jobs"
        404:
          description: "Data not found"

  /dashboard/jobRatioBySubcategory:
    get:
      summary: Get job ratio by subcategory
      description: Retrieve the number of jobs per subcategory, including the Grand Total if no subcategory is specified.
      tags:
        - dashboard
      parameters:
        - in: query
          name: sub_category_id
          required: false
          description: The ID of the subcategory to filter jobs by. If not provided, the Grand Total is returned.
          schema:
            type: integer
            example: 6287
      responses:
        "200":
          description: Successfully retrieved job ratio by subcategory
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sub_category_name:
                          type: string
                          example: "Software Development"
                        total_jobs:
                          type: integer
                          example: 150
        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status type is required: sub_category_id is missing or empty"
        "404":
          description: No data found for the provided subcategory ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioBySubcategory query"

  /dashboard/jobRatioByType:
    get:
      summary: Get job ratio by job type
      description: Retrieve the number of jobs categorized by job type (e.g., Full-time, Part-time, Contract, etc.).
      tags:
        - dashboard
      parameters:
        - in: query
          name: type
          required: false
          description: The job type to filter by (e.g., Full-time, Part-time, Contract). If not provided, returns the Grand Total.
          schema:
            type: string
            example: "Full time"
      responses:
        "200":
          description: Successfully retrieved job ratio by type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: "Full-time"
                        total_jobs:
                          type: integer
                          example: 250
        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status type is required: type is missing or empty"
        "404":
          description: No data found for the provided job type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioByType query"

  /dashboard/jobRatioByLocation:
    get:
      summary: Get job ratio by location
      description: Retrieve the number of jobs categorized by city, area, and country.
      tags:
        - dashboard
      parameters:
        - in: query
          name: city
          required: false
          description: The city to filter job data by. If not provided, returns job counts for all locations.
          schema:
            type: string
            example: "Bangkok"
      responses:
        "200":
          description: Successfully retrieved job ratio by location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        area:
                          type: string
                          example: "Central"
                        city:
                          type: string
                          example: "Bangkok"
                        country:
                          type: string
                          example: "Thailand"
                        total_jobs:
                          type: integer
                          example: 120
        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status city is required: city is missing or empty"
        "404":
          description: No data found for the provided city
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioByLocation query"

  /dashboard/jobCountByDate/{day}:
    get:
      summary: Get job count by date range
      description: Retrieve the total number of job postings within the last specified number of days.
      tags:
        - dashboard
      parameters:
        - in: path
          name: day
          required: true
          description: The number of past days to retrieve job count from.
          schema:
            type: integer
            minimum: 1
            example: 30
      responses:
        "200":
          description: Successfully retrieved job count within the specified date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "The total number of job postings in the past 7 days."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        total_jobs:
                          type: integer
                          example: 350
        "400":
          description: Bad request due to missing or invalid path parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Invalid day parameter. Please provide a valid positive number."
        "404":
          description: No job postings found in the specified date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobCountByDate query"

components:
  schemas:
    basicinfo:
      type: object
      properties:
        job_id:
          type: number
        title:
          type: string
        type:
          type: string
        status:
          type: string
        posted_date:
          type: string
          format: date-time
        expiry_date:
          type: string
          format: date-time
    status:
      type: object
      properties:
        status:
          type: string
          default: ""
          nullable: true
          description: Job status (e.g., 'active', 'expired').
        limit:
          type: integer
          default: 100
          description: The maximum number of records to retrieve. A lower limit (e.g., 50-100) is recommended to prevent system hang-ups.
        offset:
          type: integer
          default: 0
          description: The starting point for pagination.
    topSelectSalary:
      type: object
      properties:
        subCategoryName:
          type: string
          default: ""
          nullable: true
          description: Job Category Name (e.g., 'Computer Operators', 'Engineering - Network').
        top:
          type: integer
          default: 5
          description: The maximum number of records to retrieve. A lower limit (e.g., 5-100) is recommended to prevent system hang-ups.
    classification:
      type: object
      properties:
        job_id:
          type: number
        main_category_id:
          type: number
        sub_category_id:
          type: number
    company:
      type: object
      properties:
        company_id:
          type: number
        name:
          type: string
        short_name:
          type: string
        industry:
          type: string
        verified:
          type: number
        company_search_url:
          type: string
        registration_date:
          type: string
          format: date-time
        company_size:
          type: string
    jobs:
      type: object
      properties:
        job_id:
          type: number
        company_id:
          type: number
        content:
          type: string
        share_link:
          type: string
    jobs_skill:
      type: object
      properties:
        job_id:
          type: number
        skill_name:
          type: string
        skill_type:
          type: string
    location:
      type: object
      properties:
        job_id:
          type: number
        area:
          type: string
        city:
          type: string
        country:
          type: string
    main_category:
      type: object
      properties:
        main_category_id:
          type: number
        name:
          type: string
    salary:
      type: object
      properties:
        job_id:
          type: number
        min_salary:
          type: number
        max_salary:
          type: number
        currency:
          type: string
        period:
          type: string
        has_salary_info:
          type: number
    sub_category:
      type: object
      properties:
        sub_category_id:
          type: number
        name:
          type: string
    Industry:
      type: string
      description: |
        Industry of the job. If not provided, all industries will be included.
        If you want to filter jobs with no specified industry, set the value to `null`.
    CompanySize:
      type: string
      description: |
        Company size of the job. If not provided, all company sizes will be included.
        If you want to filter jobs with no specified company size, set the value to `null`.