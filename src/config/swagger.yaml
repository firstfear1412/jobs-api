openapi: 3.0.0
info:
  title: ๋Jobs API
  description: Finds Jobs Project from Kasetsart University Sriracha Campus.
  version: 0.1
servers:
  - url: http://localhost:3000/
    # description: My Localhost
paths:
  /dashboard/topSkillByPost/{type}:
    get:
      summary: "Get top 5 skills by post type"
      tags:
        - "dashboard"
      parameters:
        - name: "type"
          in: "path"
          description: "The type of skill to fetch (e.g., 'hard_skill', 'soft_skill')"
          required: true
          type: "string"
      responses:
        200:
          description: "A list of skills with job count"
          content:
            application/json:
              schema:
                # อ้างอิงไปที่ Component เพื่อแสดงรายละเอียด
                $ref: "#/components/schemas/dashboardTopSkill"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/avgSalary:
    get:
      summary: "Get min, max, average salary of all jobs by city"
      tags:
        - "dashboard"
      parameters:
        - name: "city"
          in: "query"
          description: "city to filter job salary"
          schema:
            type: "string"
            format: "string"
            nullable: true
      responses:
        200:
          description: "A result min, max, and average salary of max salary"
          content:
            application/json:
              schema:
                # อ้างอิงไปที่ Component เพื่อแสดงรายละเอียด
                $ref: "#/components/schemas/dashboardAvgSalary"
        404:
          description: "Data not found"
  /dashboard/jobByStatus:
    post:
      summary: Get job information by status or count jobs if no status provided.
      description: |
        - If status is provided, returns detailed job information.
        - If no status is provided (or status is null), returns the count of jobs by status.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/dashboardJobByStatus"
      responses:
        200:
          description: A successful response that provides a list of jobs filtered by the provided status, or, if no status is provided (or the status is null), returns the count of jobs grouped by their status. The response will include detailed job information or just the job count, depending on the provided parameters.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/dashboardjobListResponse"
                  - $ref: "#/components/schemas/dashboardJobByStatusResponse"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByMaxSalary:
    post:
      summary: Get job information with the highest salary by subcategory.
      description: |
        - If no subcategory name is provided, this API returns the jobs with the highest salary by subcategory.
        - If a subcategory name is provided, it returns jobs in that subcategory with the highest salary.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/dashboardJobBySalary"
      responses:
        200:
          description: "Successful response with job data based on the maximum salary."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/dashboardjobByMaxSalary"
                  - $ref: "#/components/schemas/dashboardCompanyListJobByMaxSalaryResponse"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByMinSalary:
    post:
      summary: "Get job information with the lowest salary by subcategory."
      description: |
        - If no subcategory name is provided, this API returns the jobs with the lowest salary by subcategory.
        - If a subcategory name is provided, it returns jobs in that subcategory with the lowest salary.
      tags:
        - "dashboard"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/dashboardJobBySalary"
      responses:
        200:
          description: "Successful response with job data based on the minimum salary."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/dashboardjobByMinSalary"
                  - $ref: "#/components/schemas/dashboardCompanyListJobMinSalaryResponse"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByIndustry:
    get:
      summary: "Get job information by Industry or count jobs if no industry provided."
      tags:
        - "dashboard"
      responses:
        200:
          description: "A list of Status with job count"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardjobByIndustry"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByIndustry/{industry}:
    get:
      summary: "Get job list by Industry"
      tags:
        - "dashboard"
      parameters:
        - name: industry
          in: path
          required: true
          schema:
          type: string
          description: |
            Industry of the job. If not provided, all industries will be included.
            If you want to filter jobs with no specified industry, set the value to `null`.
      responses:
        200:
          description: "A list of jobs filtered by the industry or jobs with no specified industry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardjobListResponse"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByCompanySize:
    get:
      summary: "Get job count by Compony Size"
      tags:
        - "dashboard"
      responses:
        200:
          description: "A list of jobs filtered by the company size or jobs with no specified company size"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardjobByCompanySize"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /dashboard/jobByCompanySize/{companySize}:
    get:
      summary: "Get list job by compony size"
      tags:
        - "dashboard"
      parameters:
        - name: companySize
          in: path
          required: true
          schema:
          type: string
          description: |
            Company size of the job. If not provided, all company sizes will be included.
            If you want to filter jobs with no specified company size, set the value to `null`.
      responses:
        200:
          description: "A list of jobs filtered by the compony size or jobs with no specified compony size"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardjobListResponse"
        400:
          description: "Invalid type parameter"
        404:
          description: "Data not found"
  /job/search:
    post:
      summary: "Search for jobs based on filters"
      tags:
        - "job"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: "Keyword to search in company name, short name, or job title"
                  example: ".NET"
                location:
                  type: string
                  description: "Search location (city or area)"
                  example: "Bangkok"
                main_category:
                  type: string
                  nullable: true
                  description: "Main category of the job"
                  example: "Information & Communication Technology"
                sub_category:
                  type: string
                  nullable: true
                  description: "Sub-category of the job"
                  example: "Developers/Programmers"
                type:
                  type: string
                  nullable: true
                  description: "Job type (e.g., Part time, Full time, Contract/Temp, Casual/Vacation)"
                  example: null
                min_salary:
                  type: number
                  format: float
                  nullable: true
                  description: "Minimum salary filter"
                  example: 100000
                max_salary:
                  type: number
                  format: float
                  nullable: true
                  description: "Maximum salary filter"
                  example: 200000
      responses:
        200:
          description: "A list of jobs"
        400:
          description: "Invalid request"
        404:
          description: "Data not found"

  /dashboard/jobRatioBySubcategory:
    get:
      summary: Get job ratio by subcategory
      description: Retrieve the number of jobs per subcategory, including the Grand Total if no subcategory is specified.
      tags:
        - dashboard
      parameters:
        - in: query
          name: sub_category_id
          required: false
          description: The ID of the subcategory to filter jobs by. If not provided, the Grand Total is returned.
          schema:
            type: integer
            example: 6287
      responses:
        "200":
          description: Successfully retrieved job ratio by subcategory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardJobRatioBySubcategory"

        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status type is required: sub_category_id is missing or empty"
        "404":
          description: No data found for the provided subcategory ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioBySubcategory query"

  /dashboard/jobRatioByType:
    get:
      summary: Get job ratio by job type
      description: Retrieve the number of jobs categorized by job type (e.g., Full time, Contract/Temp, Contract/Temp, Part time, Casual/Vacation, etc.).
      tags:
        - dashboard
      parameters:
        - in: query
          name: type
          required: false
          description: The job type to filter by (e.g., Full time, Contract/Temp, Contract/Temp, Part time, Casual/Vacation). If not provided, returns the Grand Total.
          schema:
            type: string
            example: "Full time"
      responses:
        "200":
          description: Successfully retrieved job ratio by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardJobRatioByType"

        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status type is required: type is missing or empty"
        "404":
          description: No data found for the provided job type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioByType query"

  /dashboard/jobRatioByLocation:
    get:
      summary: Get job ratio by location
      description: Retrieve the number of jobs categorized by city, area, and country.
      tags:
        - dashboard
      parameters:
        - in: query
          name: city
          required: false
          description: The city to filter job data by. If not provided, returns job counts for all locations.
          schema:
            type: string
            example: "Bangkok"
      responses:
        "200":
          description: Successfully retrieved job ratio by location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardJobRatioByLocation"

        "400":
          description: Bad request due to missing or invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Status city is required: city is missing or empty"
        "404":
          description: No data found for the provided city
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobRatioByLocation query"

  /dashboard/jobCountByDate/{day}:
    get:
      summary: Get job count by date range
      description: Retrieve the total number of job postings within the last specified number of days.
      tags:
        - dashboard
      parameters:
        - in: path
          name: day
          required: true
          description: The number of past days to retrieve job count from.
          schema:
            type: integer
            minimum: 1
            example: 100
      responses:
        "200":
          description: Successfully retrieved job count within the specified date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dashboardJobCountByDate"

        "400":
          description: Bad request due to missing or invalid path parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Invalid day parameter. Please provide a valid positive number."
        "404":
          description: No job postings found in the specified date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Data not found"
        "500":
          description: Internal server error when processing the request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errormessage:
                    type: string
                    example: "Error executing jobCountByDate query"

components:
  schemas:
    masterResponse:
      type: object
      properties:
        success:
          type: boolean
        countObj:
          type: number
        total:
          type: number
          nullable: true
    jobListResponse:
      type: object
      properties:
        job_id:
          type: integer
          description: The unique identifier of the job
        basicInfo:
          type: object
          properties:
            title:
              type: string
            type:
              type: string
            status:
              type: string
            postedDate:
              type: string
              format: date-time
            expiryDate:
              type: string
              format: date-time
        salary:
          type: object
          properties:
            minSalary:
              type: integer
              nullable: true
            maxSalary:
              type: integer
              nullable: true
            currency:
              type: string
              nullable: true
            period:
              type: string
              nullable: true
        classification:
          type: object
          properties:
            mainCategory:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            subCategory:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
        location:
          type: object
          properties:
            area:
              type: string
              nullable: true
            city:
              type: string
            country:
              type: string
        company:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            shortName:
              type: string
              nullable: true
            industry:
              type: string
              nullable: true
            size:
              type: string
              nullable: true
            companySearchUrl:
              type: string
              format: uri
        content:
          type: string
        extractSkills:
          type: object
          properties:
            hardSkill:
              type: array
              items:
                type: string
            softSkill:
              type: array
              items:
                type: string
        shareLink:
          type: string
          format: uri

    #Ter
    dashboardTopSkill:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            properties:
              skill_name:
                type: string
              job_count:
                type: integer
    dashboardAvgSalary:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            properties:
              min_salary:
                type: number
              max_salary:
                type: number
              avg_salary:
                type: number

    #Art
    dashboardJobRatioBySubcategory:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            properties:
              sub_category_name:
                type: string
              total_jobs:
                type: integer

    dashboardJobRatioByType:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            properties:
              type:
                type: string
              total_jobs:
                type: integer

    dashboardJobRatioByLocation:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            properties:
              area:
                type: string
              city:
                type: string
              country:
                type: string
              total_jobs:
                type: integer

    dashboardJobCountByDate:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            properties:
              total_jobs:
                type: integer
    #Max
    dashboardjobByCompanySize:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              company_size:
                type: string
                description: "The company size (e.g., 5,001-10,000 employees)"
              total:
                type: integer
                description: "The total number of jobs available for that company size"
    dashboardjobByIndustry:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              industry:
                type: string
                description: "The company size (e.g., 5,001-10,000 employees)"
              total:
                type: integer
                description: "The total number of jobs available for that company size"
    dashboardjobByMaxSalary:
      type: object
      properties:
        sub_category_id:
          type: integer
        sub_category_name:
          type: string
        max_salary:
          type: string

    dashboardCompanyListJobByMaxSalaryResponse:
      type: object
      properties:
        company_id:
          type: integer
        company_name:
          type: string
        short_name:
          type: string
        industry:
          type: string
        company_size:
          type: string
        max_salary:
          type: string
    dashboardjobByMinSalary:
      type: object
      properties:
        sub_category_id:
          type: integer
        sub_category_name:
          type: string
        min_salary:
          type: string

    dashboardCompanyListJobMinSalaryResponse:
      type: object
      properties:
        company_id:
          type: integer
        company_name:
          type: string
        short_name:
          type: string
        industry:
          type: string
        company_size:
          type: string
        job_name:
          type: string
        min_salary:
          type: string
    dashboardjobListResponse:
      allOf:
        - $ref: "#/components/schemas/masterResponse"
        - type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/jobListResponse"
    dashboardJobByStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        countObj:
          type: integer
        total:
          type: integer
          nullable: true
        data:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              total:
                type: integer
  requestBodies:
    dashboardJobByStatus:
      type: object
      properties:
        status:
          type: string
          default: ""
          nullable: true
          description: Job status (e.g., 'active', 'expired').
        limit:
          type: integer
          default: 100
          description: The maximum number of records to retrieve. A lower limit (e.g., 50-100) is recommended to prevent system hang-ups.
        offset:
          type: integer
          default: 0
          description: The starting point for pagination.
    dashboardJobBySalary:
      type: object
      properties:
        subCategoryName:
          type: string
          default: ""
          nullable: true
          description: Job Category Name (e.g., 'Computer Operators', 'Engineering - Network').
        top:
          type: integer
          default: 5
          description: The maximum number of records to retrieve. A lower limit (e.g., 5-100) is recommended to prevent system hang-ups.
